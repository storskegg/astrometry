[package]
name = "horae"
description = "Traditional astrology on the astrometry ephemeris: signs, dignities, aspects, the Moon, and the planetary days and hours"
version = "2026.46.7"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/storskegg/astrometry"
readme = "README.md"
keywords = ["astrology", "planetary-hours", "zodiac", "ephemeris"]
categories = ["science", "date-and-time"]
publish = false

[features]
default = ["embedded", "theories"]
# astrometry's: the DE440 slice compiled in, or given by `astrometry::slice::install`.
embedded = ["astrometry/embedded"]
# astrometry's: VSOP87E and ELP/MPP02 beyond 1800–2200, or errors there.
theories = ["astrometry/theories"]
# astrometry's: Uranus, Neptune and Pluto, in `chart` (with `embedded`, or given by
# `astrometry::slice::install_outer`).
outer-planets = ["astrometry/outer-planets"]
serde = ["dep:serde", "jiff/serde", "astrometry/serde"]

[dependencies]
astrometry = { path = "..", version = "2026.46.7", default-features = false }
jiff = "0.2"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bench]]
name = "horae"
harness = false

[lints]
workspace = true
