[package]
name = "astrometry"
description = "Apparent positions of the Sun, Moon and planets, as close to JPL Horizons as we can make them"
version = "1.2.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/storskegg/astrometry"
readme = "README.md"
keywords = ["astronomy", "ephemeris", "jpl", "vsop87", "astrology"]
categories = ["science", "date-and-time"]
# Not on crates.io for now: packaged, it's just over its 10 MiB.
publish = false

[features]
# Serialize and Deserialize for the angles and stations.
serde = ["dep:serde"]

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [".", "horae", "xtask"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The series run to tens of thousands of terms: optimise them even in debug builds.
[profile.dev.package.astrometry]
opt-level = 3
