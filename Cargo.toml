[package]
name = "astrometry"
description = "Apparent positions of the Sun, Moon and planets, as close to JPL Horizons as we can make them"
version = "2026.46.7"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/storskegg/astrometry"
readme = "README.md"
keywords = ["astronomy", "ephemeris", "jpl", "vsop87", "astrology"]
categories = ["science", "date-and-time"]
# Not on crates.io for now: packaged, it's just over its 10 MiB.
publish = false

[features]
default = ["embedded", "theories"]
# The DE440 slice compiled in (8 MB). Without it, `slice::install` takes its bytes at run time.
embedded = []
# VSOP87E and ELP/MPP02 (some 2 MB of series), for dates beyond the slice; without them,
# those are errors.
theories = []
# Uranus, Neptune and Pluto from DE440, in a file of their own (0.7 MB): compiled in with
# `embedded`, otherwise given by `slice::install_outer`. Without it, they are errors.
outer-planets = []
# Serialize and Deserialize for the angles and stations.
serde = ["dep:serde"]

[dependencies]
flate2 = "1"
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true

[workspace]
resolver = "3"
members = [".", "horae", "xtask"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The series run to tens of thousands of terms: optimise them even in debug builds.
[profile.dev.package.astrometry]
opt-level = 3
