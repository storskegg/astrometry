name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Without the slice compiled in, as a browser's build has it.
      - run: cargo clippy -p astrometry -p horae --all-targets --no-default-features --locked -- -D warnings
      - run: cargo check -p horae --no-default-features --target wasm32-unknown-unknown --locked

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # JPL's DE440 (120 MB) for the JPL tests, which skip without it: downloaded once into
      # the cache, on Linux only.
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/de440.bsp
          key: de440-bsp
      - if: matrix.os == 'ubuntu-latest'
        run: test -f "$RUNNER_TEMP/de440.bsp" || curl -sS --fail -L -o "$RUNNER_TEMP/de440.bsp" https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de440.bsp
      # With the features too: horae's serde, whose JSON astro-clock caches.
      - run: cargo test --workspace --all-features --locked
        env:
          # Set on Linux only, where the tests then require it.
          ASTROMETRY_DE440: ${{ matrix.os == 'ubuntu-latest' && format('{0}/de440.bsp', runner.temp) || '' }}
      # Without the slice compiled in: installed from its bytes.
      - run: cargo test -p astrometry --no-default-features --lib --locked slice::tests

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
