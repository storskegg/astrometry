name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Without the slice compiled in, as a browser's build has it.
      - run: cargo clippy -p astrometry -p horae --all-targets --no-default-features --locked -- -D warnings
      - run: cargo check -p horae --no-default-features --target wasm32-unknown-unknown --locked

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # With the features too: horae's serde, whose JSON astro-clock caches.
      - run: cargo test --workspace --all-features --locked
      # Without the slice compiled in: installed from its bytes.
      - run: cargo test -p astrometry --no-default-features --lib --locked slice::tests

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  # Astro Clock's iOS app links the core, so both crates must build for iOS.
  ios:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p astrometry -p horae --target ${{ matrix.target }} --locked
      - run: cargo build -p astrometry -p horae --target ${{ matrix.target }} --no-default-features --locked
      - run: cargo build -p astrometry -p horae --target ${{ matrix.target }} --all-features --locked
